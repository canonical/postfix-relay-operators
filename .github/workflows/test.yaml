name: Tests

on:
  pull_request:

jobs:
  unit-tests:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    strategy:
      matrix:
        charm: [postfix-relay, postfix-relay-configurator]
    with:
      vale-style-check: false
      working-directory: ./${{ matrix.charm }}-operator
